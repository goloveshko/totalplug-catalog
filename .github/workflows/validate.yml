name: Validate Community PR

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'plugins/**'
      - 'schemas/**'
      - 'scripts/**'

jobs:
  validate-schema:
    name: Validate JSON Schema & Manifests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js to use the AJV JSON Schema validator CLI
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install AJV CLI tools globally
      - name: Install AJV CLI
        run: npm install -g ajv-cli ajv-formats

      # Step 4: Validate all plugin manifests against the JSON schema
      - name: Validate All Manifests against Schema
        run: |
          ajv validate \
            -s schemas/plugin.schema.json \
            -d "plugins/**/*.json" \
            --spec=draft2020 \
            -c ajv-formats \
            --all-errors

  test-builder:
    name: Test Go Builder Dry-Run
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Go toolchain
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Step 3: Run the Go builder to ensure manifests resolve without runtime errors
      - name: Run Catalog Builder Dry-Run
        run: |
          go run scripts/builder/main.go -plugins=plugins -out=dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}